<div class="w-1.5 h-12 rounded-full bg-on-primary/60 mt-4 opacity-75"></div>
<div class="p-2 mt-4 text-on-primary opacity-60">
<span class="material-symbols-outlined text-[20px]">close</span>
</div>

</div>
</div>
<script>
  (function initDrawerInteractions() {
    const folderWorkBtn = document.getElementById('toggleFolderWork');
    const folderWorkChildren = document.getElementById('childrenFolderWork');
    const caretWork = document.getElementById('caretFolderWork');

    if (folderWorkBtn && folderWorkChildren && caretWork) {
      folderWorkBtn.addEventListener('click', () => {
        const isCollapsed = folderWorkChildren.classList.contains('hidden');
        if (isCollapsed) {
          folderWorkChildren.classList.remove('hidden');
          folderWorkChildren.classList.add('flex');
          caretWork.classList.remove('-rotate-90');
        } else {
          folderWorkChildren.classList.add('hidden');
          folderWorkChildren.classList.remove('flex');
          caretWork.classList.add('-rotate-90');
        }
      });
    }

    const folderPersonalBtn = document.getElementById('toggleFolderPersonal');
    const folderPersonalChildren = document.getElementById('childrenFolderPersonal');
    const caretPersonal = document.getElementById('caretFolderPersonal');

    if (folderPersonalBtn && folderPersonalChildren && caretPersonal) {
      folderPersonalBtn.addEventListener('click', () => {
        const isCollapsed = folderPersonalChildren.classList.contains('hidden');
        if (isCollapsed) {
          folderPersonalChildren.classList.remove('hidden');
          folderPersonalChildren.classList.add('flex');
          caretPersonal.classList.remove('-rotate-90');
        } else {
          folderPersonalChildren.classList.add('hidden');
          folderPersonalChildren.classList.remove('flex');
          caretPersonal.classList.add('-rotate-90');
        }
      });
    }

    const backdrop = document.getElementById('backdropTouchZone');
    const closeBtn = document.getElementById('closeDrawerBtn');
    
    function triggerBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        const drawer = document.getElementById('navigationDrawer');
        if (drawer) {
          drawer.classList.add('-translate-x-full');
        }
      }
    }

    if (backdrop) backdrop.addEventListener('click', triggerBack);
    if (closeBtn) closeBtn.addEventListener('click', triggerBack);
  })();
</script></main></body></html>
